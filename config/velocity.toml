# velocity.toml — clean setup for Render + EaglerXServer

[server]
motd = "Welcome to EaglerX Network!"
show-max-players = true
max-players = 100
online-mode = true

[forced-hosts]
# leave empty unless you want host-based forwarding
# "play.example.com" = "paper_backend"

[servers]
paper_backend = "chromiumnetworkco.falixsrv.me:25565"

[advanced]
# advanced options
velocity-version = "3.5.0-SNAPSHOT"

[compression]
# server->client compression
threshold = 256

[logging]
# enable/disable console logging
console = true

[metrics]
enabled = true

[forwarding]
# Modern config for forwarding; secret is auto-generated by Velocity
secret-file = "forwarding.secret"
