# velocity.toml

[servers]
paper_backend = "chromiumnetworkco.falixsrv.me:25565"

[fallback]
server = "paper_backend"

[bind]
host = "0.0.0.0"
port = 25565

[forwarding]
mode = "MODERN"
secret-file = "forwarding.secret"

[players]
online-mode = false

[metrics]
enabled = true

[advanced]
log-fine-timestamps = true

[query]
enabled = true
port = 25577
